version: '3'
services:
  zookeeper:
    image: eventuateio/eventuate-zookeeper:$EVENTUATE_COMMON_VERSION
    ports:
      - 2181:2181
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  rabbitmq:
    build: ./rabbitmq
    image: eventuateio/eventuate-rabbitmq:DOCKER_IMAGE_TAG
    ports:
      - 5672:5672
